plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mongle'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation platform('software.amazon.awssdk:bom:2.57.2')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
	}
	implementation 'software.amazon.awssdk:apache5-client'
	implementation('software.amazon.awssdk:sts') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
	}
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	// Full integration suite retains multiple Spring/JPA contexts. Production heap is configured separately.
	maxHeapSize = '1g'
	useJUnitPlatform()
}

// Opt-in native MySQL regressions; fixtures are created by scripts/mysql84-test.py.
sourceSets {
    mysqlTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}
configurations {
    mysqlTestImplementation.extendsFrom testImplementation
    mysqlTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('mysqlTest', Test) {
    description = 'Runs against the disposable native MySQL 8.4 fixture (use scripts/mysql84-test.py).'
    group = 'verification'
    testClassesDirs = sourceSets.mysqlTest.output.classesDirs
    classpath = sourceSets.mysqlTest.runtimeClasspath
    maxHeapSize = '1g'
    useJUnitPlatform()
    doFirst {
        if (!System.getenv('MONGLE_MYSQL_TEST_PORT')) {
            throw new GradleException('Run python3 scripts/mysql84-test.py first; no external DB is accepted.')
        }
    }
}
