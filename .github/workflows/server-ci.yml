name: Server CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Test artifact packaging contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test and build executable JAR
        run: ./gradlew --no-daemon test bootJar

      - name: Upload test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7


      - name: Stage verified executable JAR
        run: python3 scripts/package-ci-artifact.py
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload verified executable JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-jar-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
