spring:
  datasource:
    url: jdbc:h2:mem:mongle-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mongle:
  dream:
    generation:
      enabled: false
  auth:
    cookie-secure: false
    allowed-origins: ${MONGLE_AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
