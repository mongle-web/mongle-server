mongle:
  oauth:
    base-url: ${OAUTH_BASE_URL:http://localhost:8080}
    kakao:
      enabled: ${MONGLE_OAUTH_KAKAO_ENABLED:true}
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}

server:
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax
        secure: ${OAUTH_COOKIE_SECURE:true}
