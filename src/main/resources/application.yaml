spring:
  application:
    name: mongle_backend
  profiles:
    default: local
  mvc:
    async:
      # LINER 전체 예산보다 길게 두되 HTTP 요청 수명도 제한한다.
      request-timeout: 130s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.mongle.backend.domain.ai: ${AI_LOG_LEVEL:INFO}
  pattern:
    # 요청 스레드의 예외·인증 로그에도 식별자를 붙인다. AI 비동기 로그는 메시지에 직접 전달한다.
    level: "%5p [requestId=%X{requestId:-}]"
  structured:
    # 운영 수집기가 JSON을 요구하면 LOG_FORMAT_CONSOLE=logstash로 활성화한다. 기본은 읽기 쉬운 텍스트다.
    format:
      console: ${LOG_FORMAT_CONSOLE:}


mongle:
  image:
    execution:
      max-concurrent-calls: ${MONGLE_IMAGE_MAX_CONCURRENT_CALLS:2}
  dream:
    generation:
      enabled: ${MONGLE_DREAM_GENERATION_ENABLED:true}
      poll-interval: ${MONGLE_DREAM_GENERATION_POLL_INTERVAL:2s}
    ai:
      max-concurrent-calls: ${MONGLE_DREAM_AI_MAX_CONCURRENT_CALLS:4}
  ai:
    async:
      # 서버 인스턴스별 초기 상한. 실제 LINER 한도와 부하 측정에 맞춰 조정한다.
      max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:16}
      response-threads: ${AI_RESPONSE_THREADS:2}
      response-queue-capacity: ${AI_RESPONSE_QUEUE_CAPACITY:64}
      log-threads: ${AI_LOG_THREADS:2}
      log-queue-capacity: ${AI_LOG_QUEUE_CAPACITY:64}
    pricing:
      models:
        # 대괄호는 모델명의 점(.)을 중첩 경로가 아닌 실제 Map 키로 보존한다.
        "[liner-mark-1.1]":
          # USD / 100만 토큰. 공식 가격표 확인: 2026-10-08. 변경 시 버전도 함께 갱신한다.
          version: ${LINER_PRICING_VERSION:2026-10-08}
          input-usd-per-million: ${LINER_INPUT_USD_PER_MILLION:1.00}
          output-usd-per-million: ${LINER_OUTPUT_USD_PER_MILLION:5.00}
          cached-input-usd-per-million: ${LINER_CACHED_INPUT_USD_PER_MILLION:0.10}
    liner:
      # 키가 없어도 서버는 기동하며 실제 AI 호출만 실패한다. 비밀 값은 저장소에 넣지 않는다.
      api-key: ${LINER_API_KEY:}
      endpoint: ${LINER_ENDPOINT:https://platform.liner.com/api/v1/chat/completions}
      model: ${LINER_MODEL:liner-mark-1.1}
      max-completion-tokens: ${LINER_MAX_COMPLETION_TOKENS:4096}
      reasoning-effort: ${LINER_REASONING_EFFORT:medium}
      connect-timeout: ${LINER_CONNECT_TIMEOUT:3s}
      request-timeout: ${LINER_REQUEST_TIMEOUT:45s}
      total-timeout: ${LINER_TOTAL_TIMEOUT:60s}
      max-retries: ${LINER_MAX_RETRIES:1}
      retry-backoff: ${LINER_RETRY_BACKOFF:300ms}
      max-retry-delay: ${LINER_MAX_RETRY_DELAY:5s}
  auth:
    secret: ${MONGLE_AUTH_SECRET:}
    issuer: mongle
    audience: mongle-api
    access-ttl: 15m
    refresh-ttl: 14d
    cookie-secure: true
    cookie-same-site: ${MONGLE_AUTH_COOKIE_SAME_SITE:Lax}
    allowed-origins: ${MONGLE_AUTH_ALLOWED_ORIGINS:}
